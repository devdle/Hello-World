<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <main class="container">
        <header class="head">
        <h1>Welcome, Student!</h1>
        <p>This is your personal dashboard.</p>
        <nav class="quick-links">
            <ul>
                <li><a href="#1">Profile</a></li>
                <li><a href="#2">Course</a></li>
                <li><a href="#3">Grades</a></li>
                <li><a href="#4">Settings</a></li>
            </ul>

        </nav>
        </header>
        <section class="profile" id="1">
            <h2>Profile</h2>
            <p>Name: John Doe</p>
            <p>Email: john.doe@example.com</p>
        </section>
        <section class="course" id="2">
            <h2>Courses</h2>
            <ul>
                <li>Mathematics</li>
                <li>Science</li>
                <li>History</li>
            </ul>
        </section>
        <section class="grades" id="3">
            <h2>Grades</h2>
            <table>
                <tr><th>Course</th><th>Grade</th></tr>
                <tr><td>Mathematics</td><td>A</td></tr>
                <tr><td>Science</td><td>B+</td></tr>
                <tr><td>History</td><td>A-</td></tr>
            </table>
        </section>
        <section class="settings" id="4">
            <h2>Settings</h2>
            <button>Update Profile</button>
            <button>Logout</button>
        </section>
    </main>
</body>
</html>
